name: Build Strat Data Cleaner

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.15'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pandas openpyxl pillow pyinstaller tkinterdnd2
        
    - name: Build Windows Executable
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --noconsole --onefile  --name="Strat Data Cleaner" --icon="assets/strat_data_cleaner.ico" --add-data "assets;assets" src/app.py
        
    - name: Build macOS Application
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --noconsole --onedir  --name="Strat Data Cleaner" --icon="assets/strat_data_cleaner.ico" --add-data "assets:assets" src/app.py
        
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Strat-Data-Cleaner-${{ matrix.os }}
        path: dist/